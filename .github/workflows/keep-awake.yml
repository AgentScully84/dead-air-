# Free Supabase projects pause after about a week with no activity.
# This pings the site's database every 3 days so it stays awake.
name: Keep the transmitter warm
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' public/config.js)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' public/config.js)
          curl -fsS "$URL/rest/v1/entries?select=id&area=eq.air&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Transmitter is warm."
